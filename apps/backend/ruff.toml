# Ruff linter configuration (replaces flake8; black keeps formatting).
# See: https://docs.astral.sh/ruff/settings/
line-length = 88
target-version = "py311"

[lint]
# Default flake8 categories (E4/E7/E9) + pyflakes (F) + isort (I).
select = ["E4", "E7", "E9", "F", "I"]
# E501: line length is enforced by black (88); E203: black's slicing
# notation uses spaces. (W503 no longer exists as a ruff rule.)
ignore = ["E501", "E203"]

[lint.per-file-ignores]
# E402: module-level import not at top of file (lazy imports inside
# if-TESTING branches, see e.g. src/main.py).
"src/**/*.py" = ["E402"]

# tests/manual scripts were excluded by flake8; keep them out.