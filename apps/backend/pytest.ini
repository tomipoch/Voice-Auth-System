[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# Test discovery
testpaths = tests

# Coverage
addopts =
    --verbose
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=50

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning