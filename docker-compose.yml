services:
  # PostgreSQL Database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: voice_biometrics_db
    environment:
      POSTGRES_DB: voice_biometrics
      POSTGRES_USER: voice_user
      POSTGRES_PASSWORD: voice_password
      TZ: America/Santiago
      PGTZ: America/Santiago
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice_user -d voice_biometrics"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Voice Biometrics API
  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: voice_biometrics_api
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=voice_biometrics
      - DB_USER=voice_user
      - DB_PASSWORD=${DB_PASSWORD:-voice_password}
      # Used by infra/db/apply_migrations.py
      - DATABASE_URL=postgresql://voice_user:${DB_PASSWORD:-voice_password}@postgres:5432/voice_biometrics
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/backend/models:/app/models # Mount ML models
      - ./apps/backend/logs:/app/logs
      # Runner de migraciones montado en modo lectura (la imagen no lo incluye)
      - ./infra/db/apply_migrations.py:/app/infra/db/apply_migrations.py:ro
      - ./infra/db/migrations:/app/infra/db/migrations:ro
    command: >
      sh -c "python /app/infra/db/apply_migrations.py && python -m src.main"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # pgAdmin for database management (optional)
  # Override PGADMIN_DEFAULT_EMAIL / PGADMIN_DEFAULT_PASSWORD in your .env;
  # do not commit real credentials.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: voice_biometrics_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change_me_pgadmin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin


volumes:
  postgres_data:
  pgadmin_data:

networks:
  default:
    name: voice_biometrics_network